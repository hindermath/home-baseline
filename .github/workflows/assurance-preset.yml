name: Assurance Preset Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    name: Assurance contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Expanded Windows package regression takes about 14 minutes, before the
    # fourteen-archive/profile integration. Retain all checks with headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned Spec Kit for generation regression
        shell: pwsh
        run: |
          python -m pip install 'git+https://github.com/github/spec-kit.git@464d57fe30c72e9a88d279cc49834539ec989c03'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          specify version
      - name: Verify published packages, profiles, contracts and generated commands
        shell: pwsh
        run: |
          foreach ($command in @('git', 'bash', 'pwsh', 'jq', 'specify')) {
            Get-Command $command -ErrorAction Stop | Select-Object Name, Source
          }
          pwsh -NoProfile -File scripts/tests/test-preset-sources.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
