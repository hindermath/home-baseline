name: Homogeneity Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Homogeneity Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - name: Run Homogeneity Check (Bash)
        if: runner.os != 'Windows'
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          REPO="$(basename "$GITHUB_WORKSPACE")"
          cd "$PARENT"
          bash "${REPO}/scripts/check-homogeneity.sh" "${REPO}"

      - name: Run Homogeneity Check (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $repo   = Split-Path $env:GITHUB_WORKSPACE -Leaf
          Set-Location $parent
          & "${repo}/scripts/check-homogeneity.ps1" -TargetDir $repo
