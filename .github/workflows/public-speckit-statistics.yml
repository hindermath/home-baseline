name: Public Spec Kit statistics

on:
  schedule:
    - cron: '17 8 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*public-speckit-statistics*'
      - 'scripts/lib/public-speckit-statistics.psm1'
      - 'scripts/tests/test-public-speckit-statistics.ps1'
      - 'docs/spec-kit-runs/**'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/public-speckit-statistics.yml'

permissions:
  contents: read

concurrency:
  group: public-speckit-statistics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Statistics tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Deterministic evidence tests
        shell: pwsh
        run: ./scripts/tests/test-public-speckit-statistics.ps1
      - name: Validate publication (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/update-public-speckit-statistics.sh --action Render --check-only
      - name: Validate publication (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/update-public-speckit-statistics.ps1 -Action Render -CheckOnly
      - name: Live public collection preview (Ubuntu)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/update-public-speckit-statistics.sh --action Collect --dry-run
          git diff --exit-code

  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'hindermath/home-baseline'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read public evidence and render candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/update-public-speckit-statistics.sh --action Collect
          bash scripts/update-public-speckit-statistics.sh --action Render
          bash scripts/update-public-speckit-statistics.sh --action Render --check-only
          git diff --check
          cat docs/spec-kit-runs/review-queue.md >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare monthly review PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: codex/monthly-public-speckit-statistics
          delete-branch: true
          commit-message: 'docs: update public Spec Kit run evidence'
          title: 'docs: update public Spec Kit run statistics'
          body: |
            Monatliche öffentliche Erhebung / Monthly public collection.

            Prüfen: Datenstand, Repository-Sichtbarkeit, Belegregister und `docs/spec-kit-runs/review-queue.md`.
            Ungeprüfte Kandidaten sind nicht gezählt. Registerentscheidungen benötigen öffentliche Belege.
            Kein Auto-Merge. Falls GitHub die Prüfungen zurückhält, diese vor dem Review freigeben.

            Review the snapshot and review queue. Unreviewed candidates are not counted.
            Approve any held workflow runs before reviewing; merge only through the normal repository policy.
          add-paths: |
            docs/spec-kit-runs/snapshot.json
            docs/spec-kit-runs/table.md
            docs/spec-kit-runs/table.en.md
            docs/spec-kit-runs/publication.json
            docs/spec-kit-runs/review-queue.md
            README.md
            README.en.md
